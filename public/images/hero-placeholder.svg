<!-- [PLACEHOLDER: add photo - Replace with transparent PNG cutout of Soham Sen] -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft mint rim light glow -->
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DAF1DE" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#8EB69B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#163832" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DAF1DE" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#8EB69B" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#163832" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#DAF1DE" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Male Developer Silhouette Cutout (Portrait with Head, Hair, Shoulders) -->
  <g id="portrait-silhouette" filter="url(#rimGlow)">
    <!-- Shoulders & Torso touching bottom edge -->
    <path d="M 60 750 C 70 620, 140 540, 220 510 C 235 505, 260 500, 300 500 C 340 500, 365 505, 380 510 C 460 540, 530 620, 540 750 Z" fill="url(#bodyGrad)" />
    
    <!-- Collared Jacket / Shirt Line Accents -->
    <path d="M 230 520 L 300 640 L 370 520" stroke="#DAF1DE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M 260 550 L 300 750" stroke="#8EB69B" stroke-width="2" opacity="0.4" />
    <path d="M 340 550 L 300 750" stroke="#8EB69B" stroke-width="2" opacity="0.4" />

    <!-- Neck -->
    <path d="M 260 410 C 260 470, 265 510, 300 510 C 335 510, 340 470, 340 410 Z" fill="#8EB69B" opacity="0.85" />
    <!-- Neck shadow / contour -->
    <path d="M 270 460 Q 300 480 330 460" stroke="#163832" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Head / Face -->
    <path d="M 220 300 C 220 410, 240 450, 300 450 C 360 450, 380 410, 380 300 C 380 200, 360 170, 300 170 C 240 170, 220 200, 220 300 Z" fill="#DAF1DE" opacity="0.9" />

    <!-- Hair (Stylized modern texture) -->
    <path d="M 210 270 C 205 210, 230 140, 300 135 C 370 140, 395 210, 390 270 C 385 240, 370 170, 340 160 C 300 150, 250 160, 225 210 C 215 230, 212 250, 210 270 Z" fill="#0B2B26" />
    <path d="M 230 160 C 270 120, 330 120, 370 160 C 350 140, 320 135, 290 140 C 260 145, 245 155, 230 160 Z" fill="#DAF1DE" opacity="0.3" />

    <!-- Glasses / Modern Developer Silhouette Accent -->
    <g stroke="#051F20" stroke-width="5" fill="none" opacity="0.75">
      <rect x="245" y="270" width="45" height="32" rx="8" />
      <rect x="310" y="270" width="45" height="32" rx="8" />
      <path d="M 290 282 L 310 282" />
      <path d="M 245 280 L 225 272" />
      <path d="M 355 280 L 375 272" />
    </g>

    <!-- Jawline & Chin Definition -->
    <path d="M 240 330 Q 300 455 360 330" stroke="#8EB69B" stroke-width="2.5" fill="none" opacity="0.5" />
    
    <!-- Outer Mint Rim-light stroke contour -->
    <path d="M 60 750 C 70 620, 140 540, 220 510 C 235 505, 260 500, 300 500 C 340 500, 365 505, 380 510 C 460 540, 530 620, 540 750" stroke="url(#rimLight)" stroke-width="4" fill="none" />
  </g>

  <!-- Subtle Developer Code Nodes / Tech Particles Around Cutout -->
  <circle cx="160" cy="460" r="4" fill="#DAF1DE" opacity="0.8" />
  <circle cx="440" cy="470" r="3" fill="#8EB69B" opacity="0.7" />
  <circle cx="210" cy="220" r="3.5" fill="#DAF1DE" opacity="0.6" />
  <circle cx="390" cy="230" r="4" fill="#DAF1DE" opacity="0.6" />
</svg>

